<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umbral 0 · Reporte semanal</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0f1f3d; --blue:#1a56db; --green:#10b981; --amber:#f59e0b; --red:#ef4444; --border:#dbeafe; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:#f4f8ff; color:#1e293b; }

  .topbar { background:linear-gradient(135deg,var(--navy) 0%,#1a3a6e 60%,var(--blue) 100%); color:white; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .topbar h1 { font-family:'Sora',sans-serif; font-size:1.05rem; font-weight:800; }
  .topbar .sub { font-size:0.74rem; opacity:0.7; }
  .topbar-right { display:flex; align-items:center; gap:10px; font-size:0.8rem; }
  .btn { border:none; border-radius:9px; padding:8px 16px; font-family:'Sora',sans-serif; font-weight:700; font-size:0.82rem; cursor:pointer; }
  .btn-blue { background:var(--blue); color:white; }
  .btn-green { background:var(--green); color:white; }
  .btn-amber { background:var(--amber); color:white; }
  .btn-ghost { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:white; }
  .btn-outline { background:white; border:1.5px solid var(--border); color:var(--navy); }
  .btn:disabled { opacity:0.55; cursor:default; }

  .wrap { max-width:920px; margin:0 auto; padding:22px 18px 60px; }

  /* LOGIN (mismo patrón que admin-duplas.html/casos.html) */
  #login-screen { max-width:380px; margin:60px auto; padding:0 18px; }
  .login-card { background:white; border-radius:16px; padding:28px 24px; border:1px solid var(--border); box-shadow:0 4px 18px rgba(15,31,61,0.08); }
  .login-card h2 { font-family:'Sora',sans-serif; font-size:1.15rem; margin-bottom:4px; color:var(--navy); }
  .login-card .sub { font-size:0.8rem; color:#64748b; margin-bottom:18px; }
  .form-field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .form-field label { font-size:0.72rem; font-weight:700; color:var(--navy); font-family:'Sora',sans-serif; text-transform:uppercase; letter-spacing:0.5px; }
  .form-field input, .form-field select, .form-field textarea { border:1.5px solid #cbd5e1; border-radius:9px; padding:10px 12px; font-size:0.9rem; font-family:'DM Sans',sans-serif; color:#1e293b; background:#f8faff; outline:none; width:100%; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color:var(--blue); background:white; }
  .pwd-wrap { position:relative; }
  .pwd-toggle { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:0.85rem; padding:2px; }
  .login-msg { font-size:0.82rem; padding:9px 12px; border-radius:9px; margin-bottom:12px; display:none; }
  .login-msg.err { background:#fff1f2; border:1.5px solid #fca5a5; color:#991b1b; display:block; }
  .login-full-btn { width:100%; padding:12px; margin-top:4px; }

  #app-screen, #denied-screen { display:none; }
  .denied-box { max-width:420px; margin:80px auto; text-align:center; padding:0 20px; }
  .denied-box .emoji { font-size:2.4rem; margin-bottom:10px; }
  .denied-box h2 { font-family:'Sora',sans-serif; color:var(--navy); margin-bottom:8px; }
  .denied-box p { font-size:0.88rem; color:#64748b; margin-bottom:18px; }

  /* RANGO DE FECHAS */
  .rango-card { background:white; border-radius:14px; padding:16px 18px; margin-bottom:18px; border:1px solid var(--border); box-shadow:0 2px 8px rgba(15,31,61,0.06); display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
  .rango-card .form-field { margin-bottom:0; min-width:160px; }

  /* SECCIONES DEL REPORTE */
  .section-title { font-family:'Sora',sans-serif; font-size:1rem; font-weight:800; color:var(--navy); margin:26px 0 10px; }
  .section-hint { font-size:0.78rem; color:#94a3b8; margin:-6px 0 12px; }
  .card { background:white; border-radius:14px; padding:18px 20px; margin-bottom:14px; border:1px solid var(--border); box-shadow:0 2px 8px rgba(15,31,61,0.06); }

  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
  .kpi { background:#f8faff; border:1px solid #e2eaf8; border-radius:10px; padding:12px 14px; }
  .kpi .num { font-family:'Sora',sans-serif; font-size:1.5rem; font-weight:800; color:var(--navy); line-height:1; }
  .kpi .lbl { font-size:0.74rem; color:#64748b; margin-top:4px; }

  table.reporte-tabla { width:100%; border-collapse:collapse; font-size:0.85rem; }
  table.reporte-tabla th, table.reporte-tabla td { text-align:left; padding:8px 10px; border-bottom:1px solid #eef2f7; }
  table.reporte-tabla th { font-family:'Sora',sans-serif; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; color:#64748b; }
  table.reporte-tabla td.num { text-align:right; font-family:'Sora',sans-serif; font-weight:700; color:var(--navy); }

  .nota-limite { font-size:0.78rem; color:#92400e; background:#fffbeb; border:1.5px solid #fcd34d; border-radius:9px; padding:10px 12px; margin-top:10px; }

  .empty-msg { font-size:0.84rem; color:#94a3b8; padding:14px; text-align:center; }

  textarea#reporte-texto, textarea#alertas-texto { width:100%; min-height:100px; font-family:monospace; font-size:0.8rem; border:1.5px solid #cbd5e1; border-radius:9px; padding:10px 12px; background:#f8faff; }
  #reporte-texto { min-height:340px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h2>🌒 Umbral 0</h2>
    <div class="sub">Reporte semanal — acceso de administración/coordinación</div>
    <div class="login-msg" id="login-error"></div>
    <div class="form-field">
      <label>Email</label>
      <input type="email" id="login-email" autocomplete="username" placeholder="tu-email@ejemplo.org">
    </div>
    <div class="form-field">
      <label>Contraseña</label>
      <div class="pwd-wrap">
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="pwd-toggle" id="pwd-toggle-btn" onclick="togglePwd()">👁️</button>
      </div>
    </div>
    <button class="btn btn-blue login-full-btn" id="login-btn" onclick="doLogin()">Ingresar</button>
  </div>
  <div style="display:flex;justify-content:center;gap:16px;margin-top:26px;">
    <a href="./casos.html" style="font-size:0.78rem;color:#94a3b8;text-decoration:none;">← Volver a Casos</a>
  </div>
</div>

<!-- SIN PERMISO -->
<div id="denied-screen">
  <div class="denied-box">
    <div class="emoji">🔒</div>
    <h2>No tenés acceso a esta sección</h2>
    <p>El reporte semanal es solo para admin/coordinación.</p>
    <button class="btn btn-outline" onclick="doLogout()">Cerrar sesión</button>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="topbar">
    <div>
      <h1>📊 Reporte semanal — Umbral 0</h1>
      <div class="sub" id="topbar-user"></div>
    </div>
    <div class="topbar-right">
      <a href="./casos.html" class="btn btn-ghost">🗂️ Casos</a>
      <button class="btn btn-ghost" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </div>

  <div class="wrap">

    <div class="rango-card">
      <div class="form-field">
        <label>Desde</label>
        <input type="date" id="f-desde">
      </div>
      <div class="form-field">
        <label>Hasta</label>
        <input type="date" id="f-hasta">
      </div>
      <button class="btn btn-blue" id="btn-generar" onclick="generarReporte()">📊 Generar reporte</button>
      <span id="generar-estado" style="font-size:0.8rem;color:#64748b;"></span>
    </div>

    <div id="reporte-cont"></div>

  </div>
</div>

<script src="../config/umbral-0.js"></script>
<script>window.PROJECT_CONFIG = window.PROJECT_CONFIG_UMBRAL_0;</script>
<script src="../shared/js/supabase-client.js"></script>
<script>

let miPerfil = null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function togglePwd(){
  const input = document.getElementById('login-pass');
  const btn = document.getElementById('pwd-toggle-btn');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁️';
}

function showScreen(id){
  ['login-screen','denied-screen','app-screen'].forEach(s=>{
    document.getElementById(s).style.display = (s===id) ? 'block' : 'none';
  });
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errBox = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errBox.style.display = 'none';
  if(!email || !pass){
    errBox.textContent = 'Completá email y contraseña.';
    errBox.style.display = 'block';
    return;
  }
  btn.disabled = true; btn.textContent = 'Ingresando…';
  try{
    await SupabaseClient.login(email, pass);
    await boot();
  }catch(e){
    errBox.textContent = 'No se pudo ingresar: ' + (e.message || 'revisá el email y la contraseña.');
    errBox.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
}

async function doLogout(){
  await SupabaseClient.logout();
  miPerfil = null;
  showScreen('login-screen');
}

function hoyStr(offsetDias){
  const d = new Date();
  d.setDate(d.getDate() + (offsetDias||0));
  return d.toISOString().slice(0,10);
}

async function boot(){
  const session = await SupabaseClient.getSession();
  if(!session){ showScreen('login-screen'); return; }
  miPerfil = await SupabaseClient.getMiPerfil();
  if(!miPerfil || !['admin','coordinacion'].includes(miPerfil.rol)){
    showScreen('denied-screen');
    return;
  }
  document.getElementById('topbar-user').textContent =
    (miPerfil.nombre || session.user.email) + ' · rol: ' + miPerfil.rol;
  showScreen('app-screen');
  // Semana por defecto: últimos 7 días hasta hoy.
  document.getElementById('f-desde').value = hoyStr(-6);
  document.getElementById('f-hasta').value = hoyStr(0);
  await generarReporte();
}

document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

// ─────────────────────────────────────────────────────────────────────────
// Cálculo del reporte — 100% desde nuestra base (personas/intervenciones/
// derivaciones), NO desde KoBo. El KoBo es el registro obligatorio crudo
// que ve gobierno; este reporte es la lectura de lo que las duplas cargan
// en la plataforma día a día (ver umbral-0/DISENO-CASOS.md, sección de
// reporte semanal, y el documento institucional Umbral Cero 27/07/2026).
//
// Ojo con lo que NO se puede calcular todavía (se marca explícito en la
// pantalla en vez de inventar un número):
//   - Origen de cada derivación a CIS (espontánea vs. seguimiento) — no
//     se guarda ese dato en `derivaciones.datos` todavía.
//   - Historial de cambios de `nivel_actual` — solo tenemos el valor
//     actual, no cuándo pasó de un nivel a otro, así que "personas
//     incorporadas al seguimiento EN ESTE PERÍODO" no es calculable con
//     precisión; se muestra como foto actual (snapshot), no como delta
//     del período.
//   - "Alertas y desvíos" no tiene tabla propia — queda como texto libre
//     para completar a mano en cada reporte.
// ─────────────────────────────────────────────────────────────────────────

async function generarReporte(){
  const desde = document.getElementById('f-desde').value;
  const hasta = document.getElementById('f-hasta').value;
  const estadoEl = document.getElementById('generar-estado');
  const btn = document.getElementById('btn-generar');
  if(!desde || !hasta){ estadoEl.textContent = 'Elegí desde/hasta.'; return; }
  btn.disabled = true; estadoEl.textContent = 'Calculando…';
  const cont = document.getElementById('reporte-cont');
  cont.innerHTML = '';
  try{
    const client = await SupabaseClient.getClient();

    const [personasRes, intervencionesRes, derivacionesRes] = await Promise.all([
      client.from('personas').select('id, zona, punto_contacto, estado, nivel_actual, created_at'),
      client.from('intervenciones').select('*').gte('fecha', desde).lte('fecha', hasta),
      client.from('derivaciones').select('tipo, estado, fecha_solicitud').gte('fecha_solicitud', desde).lte('fecha_solicitud', hasta + 'T23:59:59'),
    ]);
    if(personasRes.error) throw personasRes.error;
    if(intervencionesRes.error) throw intervencionesRes.error;
    if(derivacionesRes.error) throw derivacionesRes.error;

    const personas = personasRes.data || [];
    const intervenciones = intervencionesRes.data || [];
    const derivaciones = derivacionesRes.data || [];
    const personaPorId = {};
    personas.forEach(p => personaPorId[p.id] = p);

    const reporte = calcularReporte({ desde, hasta, personas, intervenciones, derivaciones, personaPorId });
    renderReporte(cont, reporte);
    estadoEl.textContent = `Listo — ${intervenciones.length} intervenciones, ${derivaciones.length} derivaciones en el período.`;
  }catch(e){
    cont.innerHTML = `<div class="empty-msg">Error calculando el reporte: ${esc(e.message)}</div>`;
    estadoEl.textContent = '';
  }finally{
    btn.disabled = false;
  }
}

function calcularReporte({ desde, hasta, personas, intervenciones, derivaciones, personaPorId }){
  // ── a. Cobertura territorial ──────────────────────────────────────────
  const zonaDe = i => (i.datos && i.datos.zona) || (i.persona_id && personaPorId[i.persona_id] && personaPorId[i.persona_id].zona) || null;
  const puntoDe = i => i.ubicacion || (i.persona_id && personaPorId[i.persona_id] && personaPorId[i.persona_id].punto_contacto) || null;

  const zonas = new Set(intervenciones.map(zonaDe).filter(Boolean));
  const puntos = new Set(intervenciones.map(puntoDe).filter(Boolean));
  const iglesias = new Set(intervenciones.filter(i => i.datos && i.datos.tipo_punto === 'Iglesia').map(puntoDe).filter(Boolean));
  const puntosNuevos = new Set(intervenciones.filter(i => i.datos && i.datos.punto_nuevo).map(puntoDe).filter(Boolean));
  const dias = new Set(intervenciones.map(i => i.fecha).filter(Boolean));
  const turnos = {};
  intervenciones.forEach(i => { const t = i.datos && i.datos.turno; if(t) turnos[t] = (turnos[t]||0) + 1; });

  const totalZonasConfig = (window.PROJECT_CONFIG.zonasOpciones || []).length;
  const pctZonasCubiertas = totalZonasConfig ? Math.round((zonas.size / totalZonasConfig) * 100) : null;

  // ── b. Población abordada ─────────────────────────────────────────────
  const personasNuevas = personas.filter(p => p.created_at >= desde && p.created_at <= (hasta + 'T23:59:59'));
  const idsPersonasNuevas = new Set(personasNuevas.map(p => p.id));
  const idsTocadasEnRango = new Set(intervenciones.map(i => i.persona_id).filter(Boolean));
  const recontactadas = [...idsTocadasEnRango].filter(id => !idsPersonasNuevas.has(id));
  const seguimientoActivo = personas.filter(p => p.estado === 'activo');

  // ── c. Evolución de casos (foto actual por nivel, no delta del período —
  // ver nota arriba: no hay historial de cambios de nivel_actual) ────────
  const porNivel = [1,2,3,4,5].map(n => ({
    nivel: n,
    cantidad: seguimientoActivo.filter(p => (p.nivel_actual||1) === n).length,
  }));

  // ── d. Intervenciones y derivaciones (cuantitativo) ─────────────────────
  const porTipo = {};
  derivaciones.forEach(d => {
    if(!porTipo[d.tipo]) porTipo[d.tipo] = { total:0, efectivizado:0, rechazado:0 };
    porTipo[d.tipo].total++;
    if(d.estado === 'efectivizado') porTipo[d.tipo].efectivizado++;
    if(d.estado === 'rechazado') porTipo[d.tipo].rechazado++;
  });
  const totalDerivaciones = derivaciones.length;
  const totalEfectivizadas = derivaciones.filter(d => d.estado === 'efectivizado').length;
  const totalRechazadas = derivaciones.filter(d => d.estado === 'rechazado').length;

  return {
    desde, hasta,
    cobertura: { zonas, puntos, iglesias, puntosNuevos, dias, turnos, pctZonasCubiertas, totalRecorridas: intervenciones.length },
    poblacion: { nuevas: personasNuevas.length, recontactadas: recontactadas.length, seguimientoActivo: seguimientoActivo.length },
    evolucion: { porNivel },
    intervencionesDerivaciones: { porTipo, totalDerivaciones, totalEfectivizadas, totalRechazadas,
      pctConcretadas: totalDerivaciones ? Math.round((totalEfectivizadas/totalDerivaciones)*100) : null },
  };
}

const NOMBRE_NIVEL = {1:'Identificación', 2:'Construcción del vínculo', 3:'Monitoreo territorial', 4:'Anclaje comunitario', 5:'Proyecto de inclusión'};

function renderReporte(cont, r){
  const fmtFechaCorta = iso => { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };

  cont.innerHTML = `
    <div class="section-title">a. Cobertura territorial</div>
    <div class="card">
      <div class="kpi-grid">
        <div class="kpi"><div class="num">${r.cobertura.zonas.size}</div><div class="lbl">Zonas recorridas${r.cobertura.pctZonasCubiertas!=null?` (${r.cobertura.pctZonasCubiertas}% de las prioritarias)`:''}</div></div>
        <div class="kpi"><div class="num">${r.cobertura.puntos.size}</div><div class="lbl">Puntos visitados</div></div>
        <div class="kpi"><div class="num">${r.cobertura.iglesias.size}</div><div class="lbl">Iglesias/puntos de referencia abordados</div></div>
        <div class="kpi"><div class="num">${r.cobertura.totalRecorridas}</div><div class="lbl">Cantidad de recorridas realizadas</div></div>
        <div class="kpi"><div class="num">${r.cobertura.dias.size}</div><div class="lbl">Días con presencia territorial</div></div>
        <div class="kpi"><div class="num">${r.cobertura.puntosNuevos.size}</div><div class="lbl">Nuevos puntos detectados</div></div>
      </div>
      ${Object.keys(r.cobertura.turnos).length ? `<div style="margin-top:12px;font-size:0.82rem;color:#334155;"><strong>Franjas horarias:</strong> ${Object.entries(r.cobertura.turnos).map(([t,n])=>`${esc(t)} (${n})`).join(' · ')}</div>` : ''}
      <div class="form-field" style="margin-top:14px;">
        <label>Puntos que requieren aumentar la frecuencia de presencia</label>
        <textarea id="txt-puntos-frecuencia" rows="2" placeholder="Es un juicio de coordinación, no se calcula solo — completalo acá antes de copiar el reporte."></textarea>
      </div>
    </div>

    <div class="section-title">b. Población abordada</div>
    <div class="card">
      <div class="kpi-grid">
        <div class="kpi"><div class="num">${r.poblacion.nuevas}</div><div class="lbl">Personas nuevas identificadas</div></div>
        <div class="kpi"><div class="num">${r.poblacion.recontactadas}</div><div class="lbl">Personas recontactadas</div></div>
        <div class="kpi"><div class="num">${r.poblacion.seguimientoActivo}</div><div class="lbl">Personas con seguimiento activo (al cierre del período)</div></div>
      </div>
      <div class="nota-limite">⚠️ "Incorporadas al seguimiento" y "con las que se perdió contacto" todavía no se pueden calcular con precisión — falta guardar cuándo cambia el nivel de vínculo de cada persona. Por ahora completalos a mano si hace falta para el reporte.</div>
    </div>

    <div class="section-title">c. Evolución de los casos — por nivel de vínculo</div>
    <div class="section-hint">Foto actual de las personas con seguimiento activo (no es el delta del período — ver nota de abajo).</div>
    <div class="card">
      <table class="reporte-tabla">
        <thead><tr><th>Nivel</th><th>Descripción</th><th style="text-align:right;">Personas</th></tr></thead>
        <tbody>
          ${r.evolucion.porNivel.map(n => `<tr><td>${n.nivel}</td><td>${NOMBRE_NIVEL[n.nivel]}</td><td class="num">${n.cantidad}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="section-title">d. Intervenciones y derivaciones</div>
    <div class="card">
      <table class="reporte-tabla">
        <thead><tr><th>Tipo de derivación</th><th style="text-align:right;">Total</th><th style="text-align:right;">Efectivizadas</th><th style="text-align:right;">Rechazadas</th></tr></thead>
        <tbody>
          ${Object.keys(r.intervencionesDerivaciones.porTipo).length ? Object.entries(r.intervencionesDerivaciones.porTipo).sort((a,b)=>b[1].total-a[1].total).map(([tipo,d]) =>
            `<tr><td>${esc(tipo)}</td><td class="num">${d.total}</td><td class="num">${d.efectivizado}</td><td class="num">${d.rechazado}</td></tr>`).join('')
            : '<tr><td colspan="4" style="text-align:center;color:#94a3b8;">Sin derivaciones en el período</td></tr>'}
        </tbody>
      </table>
      <div class="kpi-grid" style="margin-top:14px;">
        <div class="kpi"><div class="num">${r.intervencionesDerivaciones.totalDerivaciones}</div><div class="lbl">Total derivaciones</div></div>
        <div class="kpi"><div class="num">${r.intervencionesDerivaciones.pctConcretadas!=null?r.intervencionesDerivaciones.pctConcretadas+'%':'—'}</div><div class="lbl">% efectivamente concretadas</div></div>
      </div>
    </div>

    <div class="section-title">Tablero de indicadores</div>
    <div class="card">
      <table class="reporte-tabla">
        <thead><tr><th>Dimensión</th><th>Indicador</th><th style="text-align:right;">Valor</th></tr></thead>
        <tbody>
          <tr><td>Cobertura</td><td>% de zonas prioritarias recorridas</td><td class="num">${r.cobertura.pctZonasCubiertas!=null?r.cobertura.pctZonasCubiertas+'%':'—'}</td></tr>
          <tr><td>Contacto</td><td>Personas nuevas identificadas</td><td class="num">${r.poblacion.nuevas}</td></tr>
          <tr><td>Revinculación</td><td>Personas con segundo contacto</td><td class="num">${r.poblacion.recontactadas}</td></tr>
          <tr><td>Continuidad</td><td>Personas con seguimiento activo</td><td class="num">${r.poblacion.seguimientoActivo}</td></tr>
          <tr><td>Acceso</td><td>% de derivaciones efectivamente concretadas</td><td class="num">${r.intervencionesDerivaciones.pctConcretadas!=null?r.intervencionesDerivaciones.pctConcretadas+'%':'—'}</td></tr>
          <tr><td>Estrategia</td><td>Derivaciones rechazadas (requieren alternativa)</td><td class="num">${r.intervencionesDerivaciones.totalRechazadas}</td></tr>
          <tr><td>Territorialidad</td><td>Puntos nuevos identificados</td><td class="num">${r.cobertura.puntosNuevos.size}</td></tr>
          <tr><td>Vínculo</td><td>Personas que pasan a seguimiento activo</td><td class="num">—</td></tr>
          <tr><td>Sostenimiento</td><td>% que sostiene el recurso luego del ingreso</td><td class="num">—</td></tr>
          <tr><td>Gestión</td><td>Alertas respondidas/articuladas por la Red</td><td class="num">—</td></tr>
          <tr><td>Resultado</td><td>Personas cuya trayectoria mejora</td><td class="num">—</td></tr>
        </tbody>
      </table>
      <div class="nota-limite">⚠️ Los indicadores marcados "—" son de juicio de coordinación o requieren datos que todavía no registramos (historial de nivel, alertas). No se inventan — se completan a mano en el reporte final si hace falta.</div>
    </div>

    <div class="section-title">Reporte de alertas y desvíos</div>
    <div class="card">
      <div class="section-hint">Sin tabla propia todavía (situaciones de riesgo, deterioro, pérdida de contacto, falta de vacantes, conflictos territoriales, etc.) — se completa a mano por ahora.</div>
      <textarea id="alertas-texto" placeholder="Ej: se perdió contacto con Fulano de Tal desde el 28/8, requiere búsqueda activa. Falta de vacantes en Casa Dorrego..."></textarea>
    </div>

    <div class="section-title">Mensaje para copiar / mandar</div>
    <div class="card">
      <div class="section-hint">Arma un resumen en texto plano con todo lo de arriba — copialo y mandalo por WhatsApp o mail a GOPA. Actualizá los campos de arriba y volvé a tocar "Armar mensaje" si los cambiaste.</div>
      <button class="btn btn-amber" style="margin-bottom:10px;" onclick="armarMensaje()">✍️ Armar mensaje</button>
      <textarea id="reporte-texto" readonly></textarea>
      <div style="margin-top:10px;">
        <button class="btn btn-blue" onclick="copiarMensaje()">📋 Copiar mensaje</button>
      </div>
    </div>
  `;

  window._ultimoReporte = r;
}

function armarMensaje(){
  const r = window._ultimoReporte;
  if(!r) return;
  const fmt = iso => { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
  const puntosFrecuencia = (document.getElementById('txt-puntos-frecuencia')||{}).value || '(sin observaciones)';
  const alertas = (document.getElementById('alertas-texto')||{}).value || '(sin alertas cargadas en este período)';
  const tiposLinea = Object.entries(r.intervencionesDerivaciones.porTipo).sort((a,b)=>b[1].total-a[1].total)
    .map(([tipo,d]) => `  · ${tipo}: ${d.total} (${d.efectivizado} efectivizadas, ${d.rechazado} rechazadas)`).join('\n') || '  (sin derivaciones)';
  const nivelesLinea = r.evolucion.porNivel.map(n => `  · Nivel ${n.nivel} (${NOMBRE_NIVEL[n.nivel]}): ${n.cantidad}`).join('\n');

  const texto = `REPORTE SEMANAL — UMBRAL CERO
Período: ${fmt(r.desde)} al ${fmt(r.hasta)}

a. COBERTURA TERRITORIAL
- Zonas recorridas: ${r.cobertura.zonas.size}${r.cobertura.pctZonasCubiertas!=null?` (${r.cobertura.pctZonasCubiertas}% de las prioritarias)`:''}
- Puntos visitados: ${r.cobertura.puntos.size}
- Iglesias/puntos de referencia abordados: ${r.cobertura.iglesias.size}
- Cantidad de recorridas realizadas: ${r.cobertura.totalRecorridas}
- Días con presencia territorial: ${r.cobertura.dias.size}
- Nuevos puntos detectados: ${r.cobertura.puntosNuevos.size}
- Puntos que requieren aumentar la frecuencia: ${puntosFrecuencia}

b. POBLACIÓN ABORDADA
- Personas nuevas identificadas: ${r.poblacion.nuevas}
- Personas recontactadas: ${r.poblacion.recontactadas}
- Personas con seguimiento activo: ${r.poblacion.seguimientoActivo}

c. EVOLUCIÓN DE LOS CASOS (nivel de vínculo, personas con seguimiento activo)
${nivelesLinea}

d. INTERVENCIONES Y DERIVACIONES
${tiposLinea}
Total: ${r.intervencionesDerivaciones.totalDerivaciones} · Efectivizadas: ${r.intervencionesDerivaciones.totalEfectivizadas} (${r.intervencionesDerivaciones.pctConcretadas!=null?r.intervencionesDerivaciones.pctConcretadas+'%':'—'}) · Rechazadas: ${r.intervencionesDerivaciones.totalRechazadas}

REPORTE DE ALERTAS Y DESVÍOS
${alertas}`;

  document.getElementById('reporte-texto').value = texto;
}

async function copiarMensaje(){
  const ta = document.getElementById('reporte-texto');
  if(!ta.value) armarMensaje();
  try{
    await navigator.clipboard.writeText(ta.value);
  }catch(e){
    ta.select();
    document.execCommand('copy');
  }
}

boot();
</script>
</body>
</html>
