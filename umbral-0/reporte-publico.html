<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte semanal — Umbral Cero</title>
<link rel="icon" type="image/png" href="../assets/huehaci-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0f1f3d; --blue:#1a56db; --green:#10b981; --amber:#f59e0b; --red:#ef4444; --border:#dbeafe; }
  * { box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:#f4f8ff; color:#1e293b; margin:0; }
  .topbar { background:linear-gradient(135deg,var(--navy) 0%,#1a3a6e 60%,var(--blue) 100%); color:white; padding:22px 20px; }
  .topbar h1 { font-family:'Sora',sans-serif; font-size:1.15rem; font-weight:800; margin:0 0 4px; }
  .topbar .periodo { font-size:0.85rem; opacity:0.85; }
  .wrap { max-width:760px; margin:0 auto; padding:18px 16px 50px; }
  .section-title { font-family:'Sora',sans-serif; font-size:0.95rem; font-weight:800; color:var(--navy); margin:24px 0 10px; }
  .section-hint { font-size:0.78rem; color:#94a3b8; margin:-6px 0 12px; }
  .card { background:white; border-radius:14px; padding:18px; margin-bottom:14px; border:1px solid var(--border); box-shadow:0 2px 8px rgba(15,31,61,0.06); }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { background:#f8faff; border:1px solid #e2eaf8; border-radius:10px; padding:12px 14px; }
  .kpi .num { font-family:'Sora',sans-serif; font-size:1.5rem; font-weight:800; color:var(--navy); line-height:1; }
  .kpi .lbl { font-size:0.74rem; color:#64748b; margin-top:4px; }
  table.reporte-tabla { width:100%; border-collapse:collapse; font-size:0.85rem; }
  table.reporte-tabla th, table.reporte-tabla td { text-align:left; padding:8px 10px; border-bottom:1px solid #eef2f7; }
  table.reporte-tabla th { font-family:'Sora',sans-serif; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; color:#64748b; }
  table.reporte-tabla td.num { text-align:right; font-family:'Sora',sans-serif; font-weight:700; color:var(--navy); }
  .tbl-wrap { overflow-x:auto; }
  .badge-nuevo { display:inline-block; padding:2px 8px; border-radius:20px; font-size:0.68rem; font-weight:700; font-family:'Sora',sans-serif; background:#d1fae5; color:#047857; margin-left:4px; }
  .nota-libre { font-size:0.86rem; color:#334155; white-space:pre-wrap; }
  .footer-nota { text-align:center; font-size:0.74rem; color:#94a3b8; margin-top:30px; }
  .huehaci-credit { display:flex; align-items:center; justify-content:center; gap:6px; font-size:0.68rem; color:#94a3b8; padding:10px 10px 0; }
  .huehaci-credit img { height:14px; width:auto; background:white; border-radius:3px; padding:1px 3px; border:1px solid #e2e8f0; }
  .empty-msg { text-align:center; color:#94a3b8; padding:60px 20px; font-size:0.92rem; }
  .casos-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  .caso-card { background:#f8faff; border:1px solid #e2eaf8; border-radius:10px; padding:0; }
  .caso-card summary { list-style:none; cursor:pointer; padding:12px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .caso-card summary::-webkit-details-marker { display:none; }
  .caso-card summary::after { content:'▾'; margin-left:auto; color:#94a3b8; font-size:0.8rem; transition:transform 0.15s; }
  .caso-card[open] summary::after { transform:rotate(180deg); }
  .caso-card .caso-dupla { font-family:'Sora',sans-serif; font-weight:800; font-size:0.72rem; color:var(--blue); background:#e0eaff; padding:2px 8px; border-radius:20px; }
  .caso-card .caso-nombre { font-weight:700; color:var(--navy); font-size:0.88rem; }
  .caso-card .caso-crit { font-size:0.68rem; font-weight:700; font-family:'Sora',sans-serif; padding:2px 8px; border-radius:20px; }
  .caso-card .crit-alta { background:#fee2e2; color:#b91c1c; }
  .caso-card .crit-media { background:#fef3c7; color:#92400e; }
  .caso-card .crit-baja { background:#f1f5f9; color:#475569; }
  .caso-card .caso-detalle { padding:2px 14px 14px; border-top:1px solid #e2eaf8; margin-top:2px; font-size:0.84rem; }
  .caso-card .caso-detalle > div { padding:5px 0; display:flex; gap:8px; }
  .caso-card .caso-detalle-lbl { flex:0 0 130px; color:#64748b; font-size:0.76rem; }
  .caso-card .caso-historia { flex-direction:column !important; }
  .caso-card .caso-historia .caso-detalle-lbl { margin-bottom:2px; flex:none; }
  .caso-card .caso-historia div { white-space:pre-wrap; color:#334155; }
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
    <img src="../assets/huehaci-logo.png" alt="Huehaci" style="height:52px; width:auto; background:white; border-radius:6px; padding:4px 8px;">
    <div style="font-size:0.68rem; color:rgba(255,255,255,0.6); line-height:1.25;">Reporte elaborado por<br><b style="color:rgba(255,255,255,0.85);">Huehaci</b> — Consultora de innovación<br>cívica y tecnológica</div>
  </div>
  <h1>🌒 Reporte semanal — Umbral Cero</h1>
  <div class="periodo" id="periodo">Cargando…</div>
</div>

<div class="wrap" id="cont">
  <div class="empty-msg">Cargando el reporte…</div>
</div>

<script src="../config/umbral-0.js"></script>
<script>window.PROJECT_CONFIG = window.PROJECT_CONFIG_UMBRAL_0;</script>
<script src="../shared/js/supabase-client.js"></script>
<script src="../shared/js/mapa-puntos.js?v=2026-09-22h"></script>
<script>

const NOMBRE_NIVEL = {1:'Identificación', 2:'Construcción del vínculo', 3:'Monitoreo territorial', 4:'Anclaje comunitario', 5:'Proyecto de inclusión'};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtFechaCorta(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// Cada caso como tarjeta plegable — mismo criterio que admin-duplas.html
// (duplicado, auto-contención de página).
function critClaseCaso(c){ return c==='Alta' ? 'crit-alta' : c==='Media' ? 'crit-media' : c==='Baja' ? 'crit-baja' : ''; }
function renderListadoCasosCards(lista){
  if(!lista || !lista.length) return '<div class="empty-msg" style="padding:30px 10px;">Sin casos nuevos ni recontactados en el período</div>';
  return `<div class="casos-grid">${lista.map(c => `
    <details class="caso-card">
      <summary>
        <span class="caso-dupla">${esc(c.dupla)}</span>
        <span class="caso-nombre">${esc(c.nombre)}</span>
        ${c.esNuevo ? '<span class="badge-nuevo">nuevo</span>' : ''}
        ${c.criticidad ? `<span class="caso-crit ${critClaseCaso(c.criticidad)}">${esc(c.criticidad)}</span>` : ''}
      </summary>
      <div class="caso-detalle">
        <div><span class="caso-detalle-lbl">DNI</span><span>${esc(c.dni || '—')}</span></div>
        <div><span class="caso-detalle-lbl">Edad</span><span>${c.edad != null ? c.edad + ' años' : '—'}${c.fechaNacimiento ? ' (' + esc(fmtFechaCorta(c.fechaNacimiento)) + ')' : ''}</span></div>
        <div><span class="caso-detalle-lbl">Teléfono</span><span>${esc(c.telefono || '—')}</span></div>
        <div><span class="caso-detalle-lbl">Zona</span><span>${esc(c.zona || '—')}</span></div>
        <div><span class="caso-detalle-lbl">Nivel</span><span>${c.nivel ? c.nivel + ' — ' + esc(NOMBRE_NIVEL[c.nivel]||'') : '—'}</span></div>
        <div><span class="caso-detalle-lbl">Acepta entrevista</span><span>${c.aceptaEntrevista ? 'Sí' : '—'}</span></div>
        ${c.historiaBreve ? `<div class="caso-historia"><span class="caso-detalle-lbl">Historia breve</span><div>${esc(c.historiaBreve)}</div></div>` : ''}
        ${c.situacionHabitacional ? `<div class="caso-historia"><span class="caso-detalle-lbl">Situación habitacional</span><div>${esc(c.situacionHabitacional)}</div></div>` : ''}
        ${c.situacionEconomica ? `<div class="caso-historia"><span class="caso-detalle-lbl">Situación económica</span><div>${esc(c.situacionEconomica)}</div></div>` : ''}
        ${c.situacionEducativa ? `<div class="caso-historia"><span class="caso-detalle-lbl">Situación educativa</span><div>${esc(c.situacionEducativa)}</div></div>` : ''}
        ${c.redesContencion ? `<div class="caso-historia"><span class="caso-detalle-lbl">Redes de contención</span><div>${esc(c.redesContencion)}</div></div>` : ''}
      </div>
    </details>
  `).join('')}</div>`;
}
function fmtFecha(iso){
  if(!iso) return '';
  const [y,m,d] = String(iso).slice(0,10).split('-');
  return `${d}/${m}/${y}`;
}

async function cargar(){
  const cont = document.getElementById('cont');
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if(!id){
    cont.innerHTML = '<div class="empty-msg">Falta el link completo — pedí que te lo reenvíen.</div>';
    return;
  }
  try{
    // Este cliente NUNCA inicia sesión (la página no tiene login) — lee
    // con la anon key, que solo puede ver `reportes_semanales_publico`
    // (RLS/grants, ver schema-ajustes.sql). No expone nombres/DNI de
    // personas: `datos` es un resumen agregado, nunca la ficha de nadie.
    const client = await SupabaseClient.getClient();
    const { data, error } = await client.from('reportes_semanales_publico').select('*').eq('id', id).single();
    if(error || !data){
      cont.innerHTML = '<div class="empty-msg">No se encontró este reporte — puede que el link esté mal copiado.</div>';
      return;
    }
    render(data);
  }catch(e){
    cont.innerHTML = `<div class="empty-msg">No se pudo cargar el reporte (${esc(e.message)}).</div>`;
  }
}

function render(r){
  const d = r.datos || {};
  document.getElementById('periodo').textContent =
    `Período: ${fmtFecha(r.desde)} al ${fmtFecha(r.hasta)} · publicado el ${fmtFecha(r.created_at)}`;

  const cobertura = d.cobertura || {};
  const poblacion = d.poblacion || {};
  const porNivel = (d.evolucion && d.evolucion.porNivel) || [];
  const idyv = d.intervencionesDerivaciones || {};
  const porTipo = idyv.porTipo || {};
  const koboOutcomes = d.koboOutcomes || null;
  const dniPendientes = d.dniPendientes || null;
  const labelsKobo = (window.PROJECT_CONFIG && window.PROJECT_CONFIG.terminoIntervencionLabels) || {};
  const accionesPlataforma = d.accionesPlataforma || { conteo:{}, totalIntervenciones:0, totalValidaciones:0 };
  const labelsAcciones = (window.PROJECT_CONFIG && window.PROJECT_CONFIG.accionesIntervencionLabels) || {};
  const observacionesDiarias = d.observacionesDiarias || [];

  document.getElementById('cont').innerHTML = `
    <div class="section-title">a. Cobertura territorial</div>
    <div class="card">
      <div class="kpi-grid">
        <div class="kpi"><div class="num">${cobertura.zonas ?? '—'}</div><div class="lbl">Zonas recorridas${cobertura.pctZonasCubiertas!=null?` (${cobertura.pctZonasCubiertas}% de las prioritarias)`:''}</div></div>
        <div class="kpi"><div class="num">${cobertura.puntos ?? '—'}</div><div class="lbl">Puntos visitados</div></div>
        <div class="kpi"><div class="num">${cobertura.totalIntervenciones ?? '—'}</div><div class="lbl">Intervenciones registradas</div></div>
        <div class="kpi"><div class="num">${cobertura.dias ?? '—'}</div><div class="lbl">Días con presencia territorial</div></div>
      </div>
      ${cobertura.puntosFrecuencia ? `<div class="nota-libre" style="margin-top:12px;"><b>Puntos que requieren aumentar la frecuencia:</b><br>${esc(cobertura.puntosFrecuencia)}</div>` : ''}
      <!-- Mapa de puntos visitados (§10.1.24) — mismo dato guardado en el
           snapshot que koboOutcomes.puntos (§10.1.50: la sección "e."
           que mostraba ese dato en una tabla se sacó del reporte
           público, pero el mapa sigue usando la misma fuente), ver
           renderMapaPuntos() llamado después de setear innerHTML, más
           abajo. -->
      <div id="reporte-publico-map" style="height:380px;border-radius:10px;margin-top:14px;"></div>
    </div>

    <div class="section-title">b. Población abordada</div>
    <div class="card">
      <div class="kpi-grid">
        <div class="kpi"><div class="num">${poblacion.nuevas ?? '—'}</div><div class="lbl">Personas nuevas identificadas</div></div>
        <div class="kpi"><div class="num">${poblacion.recontactadas ?? '—'}</div><div class="lbl">Personas recontactadas</div></div>
        <div class="kpi"><div class="num">${poblacion.seguimientoActivo ?? '—'}</div><div class="lbl">Personas con seguimiento activo</div></div>
        <div class="kpi"><div class="num">${poblacion.aceptaEntrevista ?? '—'}</div><div class="lbl">Aceptan entrevista</div></div>
      </div>
    </div>

    <div class="section-title">c. Evolución de los casos — por nivel de vínculo</div>
    <div class="card">
      <table class="reporte-tabla">
        <thead><tr><th>Nivel</th><th>Descripción</th><th style="text-align:right;">Personas</th></tr></thead>
        <tbody>
          ${porNivel.map(n => `<tr><td>${esc(n.nivel)}</td><td>${esc(NOMBRE_NIVEL[n.nivel]||'')}</td><td class="num">${n.cantidad}</td></tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:#94a3b8;">Sin datos</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="section-title">d. Intervenciones y derivaciones</div>
    <div class="card">
      <table class="reporte-tabla">
        <thead><tr><th>Tipo de derivación</th><th style="text-align:right;">Total</th><th style="text-align:right;">Efectivizadas</th><th style="text-align:right;">Rechazadas</th></tr></thead>
        <tbody>
          ${Object.keys(porTipo).length ? Object.entries(porTipo).sort((a,b)=>b[1].total-a[1].total).map(([tipo,t]) =>
            `<tr><td>${esc(tipo)}</td><td class="num">${t.total}</td><td class="num">${t.efectivizado}</td><td class="num">${t.rechazado}</td></tr>`).join('')
            : (koboOutcomes && Object.keys(koboOutcomes.conteo).length
                ? Object.entries(koboOutcomes.conteo).sort((a,b)=>b[1]-a[1]).map(([codigo,n]) =>
                    `<tr><td>${esc(labelsKobo[codigo]||codigo)}</td><td class="num">${n}</td><td class="num">—</td><td class="num">—</td></tr>`).join('')
                : '<tr><td colspan="4" style="text-align:center;color:#94a3b8;">Sin derivaciones en el período</td></tr>')}
        </tbody>
      </table>
      <div class="kpi-grid" style="margin-top:14px;">
        <div class="kpi"><div class="num">${idyv.totalDerivaciones || (koboOutcomes ? Object.values(koboOutcomes.conteo).reduce((a,b)=>a+b,0) : 0)}</div><div class="lbl">Total derivaciones</div></div>
        <div class="kpi"><div class="num">${idyv.pctConcretadas!=null?idyv.pctConcretadas+'%':'—'}</div><div class="lbl">% efectivamente concretadas</div></div>
      </div>
      <!-- Denuncia de extravío de DNI vs. trámite formalizado (§10.1.21) -->
      ${dniPendientes && dniPendientes.personasConDenunciaExtravio > dniPendientes.derivacionesHacerDni ? `<div class="nota-limite">⚠️ Hay ${dniPendientes.personasConDenunciaExtravio} personas cargadas con denuncia de extravío de DNI (estado actual de la ficha, no acotado al período) pero solo ${dniPendientes.derivacionesHacerDni} con el trámite de "Hacer DNI" formalizado como derivación en la plataforma — a ${dniPendientes.personasConDenunciaExtravio - dniPendientes.derivacionesHacerDni} les faltaría iniciar el trámite ahí.</div>` : ''}
    </div>

    <!-- Sección "Derivaciones y contactos según KoBo (terreno)" (§10.1.20,
         antes "e.") sacada a propósito del reporte PÚBLICO (§10.1.50,
         pedido de Agustina: "la diferencia entre la derivación en nuestra
         plataforma y lo que se sube a KoBo nos complica, debería verlo yo
         en el admin pero no hace falta que gobierno lo vea"). Sigue
         existiendo en admin-duplas.html#reporte (uso interno) — ver
         DISENO-CASOS.md §10.1.50. El fallback de la tabla de "d." (mostrar
         los conteos de KoBo cuando no hay derivaciones cargadas en la
         plataforma) se mantiene sin cambios, solo se sacó el aviso que
         señalaba explícitamente esa diferencia. -->

    <div class="section-title">e. Qué hicieron las duplas — confirmado en la plataforma</div>
    <div class="card">
      <table class="reporte-tabla">
        <thead><tr><th>Qué hicieron</th><th style="text-align:right;">Cantidad</th></tr></thead>
        <tbody>
          ${Object.keys(accionesPlataforma.conteo).length ? Object.entries(accionesPlataforma.conteo).sort((a,b)=>b[1]-a[1]).map(([codigo,n]) =>
            `<tr><td>${esc(labelsAcciones[codigo]||codigo)}</td><td class="num">${n}</td></tr>`).join('')
            : '<tr><td colspan="2" style="text-align:center;color:#94a3b8;">Sin acciones confirmadas en la plataforma en el período</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="section-title">f. Observaciones diarias del equipo</div>
    <div class="card">
      ${observacionesDiarias.length ? observacionesDiarias.map(o => `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);">
          <div style="font-size:0.78rem;color:#64748b;font-weight:700;">Dupla ${esc(o.dupla)} · ${fmtFechaCorta(o.fecha)}</div>
          <div style="font-size:0.85rem;white-space:pre-wrap;margin-top:2px;">${esc(o.texto)}</div>
        </div>
      `).join('') : '<div class="nota-libre">Sin observaciones cargadas en este período.</div>'}
    </div>

    <div class="section-title">Listado de casos del período</div>
    <div class="section-hint" style="margin-bottom:10px;">Tocá una tarjeta para ver el detalle.</div>
    ${renderListadoCasosCards(d.listadoCasos)}

    ${d.alertas ? `
    <div class="section-title">Alertas y desvíos</div>
    <div class="card"><div class="nota-libre">${esc(d.alertas)}</div></div>
    ` : ''}

    <div class="footer-nota">Umbral Cero · programa territorial nocturno</div>
    <div class="huehaci-credit">
      <img src="../assets/huehaci-logo.png" alt="Huehaci">
      <span>Reporte elaborado por Huehaci — Consultora de innovación cívica y tecnológica</span>
    </div>
  `;
  if(window.renderMapaPuntos){
    renderMapaPuntos('reporte-publico-map', (koboOutcomes && koboOutcomes.puntos) || [], window.PROJECT_CONFIG && window.PROJECT_CONFIG.zonasOperativas);
  }
}

cargar();
</script>
</body>
</html>
