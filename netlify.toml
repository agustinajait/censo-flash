# Configuración de Netlify. Agregado solo para habilitar la función
# serverless de corrección de redacción por IA
# (netlify/functions/corregir-texto.js, usada desde umbral-0/casos.html).
# No define [build]/publish a propósito, para no pisar la configuración
# de publicación que ya está cargada en el dashboard de Netlify.

[functions]
  directory = "netlify/functions"

# Edge function que redirige la raíz de ciertos dominios propios a otra
# página que no es la raíz del repo (ver
# netlify/edge-functions/dominios-propios.js, antes "umbral0-domain",
# 25/11/2026: ahora cubre umbral0.huehaci.com Y releva.huehaci.com) — no
# toca nada del resto de los dominios (censoflash.huehaci.com, el
# default de Netlify, etc.), que siguen sirviendo Censo Flash en la raíz
# como siempre.
[[edge_functions]]
  path = "/"
  function = "dominios-propios"
