# Configuración de Netlify. Agregado solo para habilitar la función
# serverless de corrección de redacción por IA
# (netlify/functions/corregir-texto.js, usada desde umbral-0/casos.html).
# No define [build]/publish a propósito, para no pisar la configuración
# de publicación que ya está cargada en el dashboard de Netlify.

[functions]
  directory = "netlify/functions"

# Edge function que redirige la raíz de umbral0.huehaci.com a la home real
# de Umbral 0 (23/9/2026, ver netlify/edge-functions/umbral0-domain.js) —
# no toca nada del resto de los dominios (censoflash.huehaci.com, el
# default de Netlify, etc.), que siguen sirviendo Censo Flash en la raíz
# como siempre.
[[edge_functions]]
  path = "/"
  function = "umbral0-domain"
